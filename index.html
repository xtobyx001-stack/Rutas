<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LLEGA YA</title>
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#0f172a;padding-bottom:90px}
header{background:#fff;padding:10px 14px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo-box{position:relative;width:42px;height:42px;background:#2563eb;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;overflow:hidden}
.logo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.brand h1{font-size:1rem;font-weight:900;line-height:1.1}
.brand small{color:#64748b;font-size:.72rem}
.hdr-right{display:flex;align-items:center;gap:8px}
.route-select{padding:9px 10px;border-radius:14px;border:1.5px solid #cbd5e1;background:#f8fafc;font-size:.9rem;font-weight:700;color:#0f172a}
.hcount{font-size:.78rem;font-weight:800;background:#eff6ff;color:#2563eb;padding:5px 12px;border-radius:20px}
header.header-r2{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-bottom-color:#1e3a5f}
header.header-r2 h1,header.header-r2 .brand small{color:#e2e8f0}
header.header-r2 .route-select{background:#1e293b;border-color:#334155;color:#e2e8f0}
header.header-r2 .hcount{background:#1e293b;color:#94a3b8}
.toolbar{display:flex;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:63px;z-index:49;overflow-x:auto}
.toolbar button{flex:1;min-width:70px;padding:13px 6px;border-radius:18px;font-weight:700;font-size:.8rem;cursor:pointer;border:1.5px solid;white-space:nowrap}
.toolbar.tb-r2{background:#0f172a;border-bottom-color:#1e3a5f}
.btn-blue{background:#e3f0ff;border-color:#90bbf5;color:#1a56c4}
.btn-green{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.btn-purple{background:#ede7f6;border-color:#b39ddb;color:#5e35b1}
.btn-scan{background:#fef3c7;border-color:#f59e0b;color:#92400e}
#mapWrap{display:none;margin:10px 14px 0;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(15,23,42,.1)}
#mc{width:100%;display:block}
.search{padding:10px 14px}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:16px;border:none;background:#fff;font-size:.88rem;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.search.search-r2 input{background:#1e293b;color:#e2e8f0}
.sw{position:relative}.sw .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:#94a3b8}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;position:sticky;top:123px;z-index:47}
.tabs .tab{flex:1;padding:12px 4px;text-align:center;font-size:.72rem;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:#94a3b8;margin-bottom:-2px;text-transform:uppercase}
.tabs .tab.active{color:#2563eb;border-bottom-color:#2563eb;background:#eff6ff}
.tabs.tabs-r2{background:#0f172a;border-bottom-color:#1e3a5f}
.tabs.tabs-r2 .tab{color:#64748b}
.tabs.tabs-r2 .tab.active{color:#60a5fa;border-bottom-color:#60a5fa;background:transparent}
.list{padding:14px}
.card{background:#fff;border-radius:20px;margin-bottom:12px;border:1px solid #e8edf4;box-shadow:0 2px 10px rgba(15,23,42,.06);padding:14px;position:relative}
.card.done{opacity:.6}
.card.nogps{border-color:#fde68a!important}
.card.card-vip{border:2px solid #f59e0b!important;box-shadow:0 0 0 3px rgba(245,158,11,.18)!important}
.card.color-blue{background:#e3f0ff!important;border-color:#2563eb!important;outline:2px solid #2563eb}
.card.color-red{background:#fee2e2!important;border-color:#ef4444!important;outline:2px solid #ef4444}
.card.color-black{background:#0f172a!important;border-color:#000!important;outline:2px solid #000}
.color-black .title{color:#f1f5f9!important}
.color-black .sub{color:#94a3b8!important}
.color-black .note{background:#1e293b!important;border-color:#334155!important;color:#94a3b8!important}
.color-black .sortbtn{background:#1e293b!important;color:#e2e8f0!important}
.color-black .vip-badge{background:#422006!important;color:#fde68a!important}
.color-black strong{color:#e2e8f0!important}
.card-top{display:flex;gap:8px}
.card-top .hl{flex:1;min-width:0}
.title{font-size:1rem;font-weight:800}
.sub{font-size:.8rem;color:#475569;margin-top:3px;word-break:break-word}
.vip-badge{display:inline-block;font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:20px;margin-left:6px;background:#fef3c7;color:#92400e;vertical-align:middle}
.tag{display:inline-block;font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.tag-gps{background:#fef3c7;color:#92400e}.tag-multi{background:#ede9fe;color:#7c3aed}
.sortcol{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.sortbtn{background:#f1f5f9;border:none;color:#94a3b8;border-radius:9px;width:28px;height:25px;font-size:.65rem;cursor:pointer}
.note{margin:8px 0;background:#f8fafc;border:1px solid #e8edf4;border-radius:12px;padding:9px 11px;font-size:.8rem;color:#334155}
.note-line{font-size:.78rem;color:#334155;padding:2px 0}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.abtn{padding:11px 6px;border-radius:16px;font-weight:700;font-size:.78rem;cursor:pointer;border:1.5px solid;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.a-map{background:#e3f0ff;border-color:#90bbf5;color:#1a56c4}
.a-wa{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.a-exp{background:#fff3e0;border-color:#ffb74d;color:#e65100}
.a-edit{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.a-ok{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.a-no{background:#fff3e0;border-color:#ffb74d;color:#e65100}
.a-back{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.a-move{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1}
.a-vip{background:#fffbeb;border-color:#f59e0b;color:#b45309}
.a-vip.active{background:#f59e0b;color:#fff}
.a-del{background:#fce8e8;border-color:#ef9a9a;color:#c62828}
.empty{text-align:center;padding:50px 18px;color:#94a3b8}
.empty span{font-size:2.5rem;display:block;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:22px}
.modal h2{font-size:1.05rem;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.72rem;font-weight:800;color:#334155;text-transform:uppercase;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:12px 13px;border-radius:13px;border:1.5px solid #e2e8f0;background:#f8fafc;font-size:.9rem}
.mbtns{display:flex;gap:9px;margin-top:14px}
.mbtns button{flex:1;padding:13px;border-radius:16px;border:1.5px solid;font-weight:700;cursor:pointer}
.ibtn{display:block;width:100%;padding:14px;border-radius:18px;font-size:.9rem;font-weight:700;cursor:pointer;text-align:center;margin-top:10px;border:1.5px solid}
.ibtn-primary{background:#e3f0ff;border-color:#90bbf5;color:#1a56c4}
.ibtn-secondary{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.ibtn-danger{background:#fce8e8;border-color:#ef9a9a;color:#c62828}
.ibtn-green{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.wa-btn{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #e2e8f0;background:#fff;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:8px}
.wa-btn.st-pendiente{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.wa-btn.st-proceso{background:#fff7ed;border-color:#fb923c;color:#ea580c}
.wa-btn.st-transito{background:#eff6ff;border-color:#3b82f6;color:#1d4ed8}
.wa-btn.st-ultimo{background:#fdf4ff;border-color:#d8b4fe;color:#7e22ce}
.wa-btn.st-entregado{background:#dcfce7;border-color:#16a34a;color:#166534}
.wa-btn.st-devuelto{background:#fef2f2;border-color:#f87171;color:#b91c1c}
.scan-box{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1}
.scan-box video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame div{width:65%;height:65%;border:3px solid #f59e0b;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scan-status{position:absolute;bottom:12px;left:0;right:0;text-align:center}
.scan-status span{background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;font-weight:700;padding:5px 14px;border-radius:20px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);padding:13px 22px;border-radius:40px;font-size:.84rem;font-weight:700;z-index:700;transition:transform .3s;color:#fff;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:#2e7d32}.toast.error{background:#c62828}.toast.info{background:#1a56c4}
.fab{position:fixed;bottom:22px;right:16px;z-index:49}
.fab button{width:52px;height:52px;border-radius:50%;font-size:1.2rem;cursor:pointer;background:#e3f0ff;border:1.5px solid #90bbf5;color:#1a56c4}
</style>
</head>
<body>
<header id="hdr">
<div class="hdr-left">
<div class="logo-box"><span>📦</span><img src="logo.png" alt="" onerror="this.style.display='none'"></div>
<div class="brand"><h1 id="hdrTitle">Ruta</h1><small id="hdrSub">Hoy</small></div>
</div>
<div class="hdr-right">
<select class="route-select" id="routeSelect" onchange="setRoute(+this.value)"><option value="1">Ruta 1</option><option value="2">Ruta 2</option></select>
<span class="hcount" id="cnt">0</span>
</div>
</header>
<div class="toolbar" id="tb">
<button class="btn-blue" onclick="document.getElementById('fx').click()">📊 Excel</button>
<button class="btn-green" onclick="document.getElementById('fj').click()">{ } JSON</button>
<button class="btn-blue" onclick="document.getElementById('fc').click()">📄 CSV</button>
<button class="btn-purple" onclick="sortNearest()">⚡ Cercanía</button>
<button class="btn-green" onclick="abrirNuevo()">+ Cliente</button>
<button class="btn-scan" onclick="openScanner()">📷 Scan</button>
</div>
<input type="file" id="fx" accept=".xlsx,.xls" style="display:none" onchange="loadXL(event)">
<input type="file" id="fj" accept=".json" style="display:none" onchange="loadJSON(event)">
<input type="file" id="fc" accept=".csv,.txt" style="display:none" onchange="loadCSV(event)">
<div id="mapWrap"><canvas id="mc"></canvas>
<div style="position:absolute;bottom:10px;right:10px;"><button onclick="openMaps()" style="background:#2563eb;color:#fff;border:none;border-radius:14px;padding:10px 16px;font-size:.78rem;font-weight:700;cursor:pointer;">🌍 Abrir en Maps</button></div>
<div style="position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:5px 10px;font-size:.7rem;font-weight:700;color:#0f172a;" id="mi"></div>
</div>
<div class="search" id="srch"><div class="sw"><span class="lupa">🔍</span><input type="text" id="bq" placeholder="Buscar por nombre, teléfono, código, nota..." oninput="render()"></div></div>
<div class="tabs" id="tabs">
<div class="tab active" onclick="switchTab('pendientes')">Rutas</div>
<div class="tab" onclick="switchTab('sin_ubicacion')">Sin GPS</div>
<div class="tab" onclick="switchTab('completados')">No Contesta</div>
<div class="tab" onclick="switchTab('exportar')">📤 Exportar</div>
</div>
<div id="list" class="list"></div>
<div class="fab"><button onclick="openM('mCfg')">⚙️</button></div>
<div class="overlay" id="mCliente"><div class="modal">
<h2 id="mCT">Nuevo Cliente</h2>
<input type="hidden" id="eId">
<div class="field"><label>Nombre</label><input type="text" id="cN" placeholder="Nombre completo"></div>
<div class="field"><label>Teléfono</label><input type="tel" id="cT" placeholder="8093334444"></div>
<div class="field"><label>Monto RD$</label><input type="number" id="cC" placeholder="0"></div>
<div class="field"><label>Coordenadas</label><input type="text" id="cX" placeholder="19.2917, -70.2558"></div>
<div class="field"><label>Nota</label><textarea id="cO" rows="2" placeholder="Nota / producto"></textarea></div>
<div class="mbtns"><button class="btn-green" onclick="saveCliente()">GUARDAR</button><button class="btn-blue" onclick="closeM('mCliente')">CANCELAR</button></div>
</div></div>
<div class="overlay" id="mCfg"><div class="modal">
<h2 id="cfgTitle">⚙️ Opciones</h2>
<button class="ibtn ibtn-green" onclick="moverTodos()">📦 Mover todos a la otra ruta</button>
<button class="ibtn ibtn-danger" onclick="borrarSeccion()">🗑️ Borrar sección actual</button>
<button class="ibtn ibtn-danger" onclick="borrarTodo()">🗑️ Borrar toda la ruta</button>
<button class="ibtn ibtn-secondary" onclick="closeM('mCfg')">CERRAR</button>
</div></div>
<div class="overlay" id="mWA" onclick="if(event.target===this)closeM('mWA')"><div class="modal" style="max-width:420px">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
<div style="width:40px;height:40px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem">💬</div>
<div><div style="font-weight:800" id="waN"></div><div style="font-size:.75rem;color:#64748b" id="waT"></div></div>
</div>
<div style="font-size:.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:8px">Nuevo Estado</div>
<div id="waE"></div>
<div class="field" style="margin-top:12px"><label>Fecha de entrega</label><input type="date" id="waFecha" onchange="localStorage.setItem('lly_B_fecha',this.value);actualizarMsg()"></div>
<div style="font-size:.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:6px">Mensaje <span id="waCC" style="float:right;color:#2563eb"></span></div>
<textarea id="waM" rows="4" style="width:100%;padding:12px;border-radius:13px;border:1.5px solid #e2e8f0;background:#f8fafc;font-size:.84rem;resize:none"></textarea>
<button onclick="sendWA()" style="width:100%;margin-top:12px;padding:15px;background:#16a34a;color:#fff;border:none;border-radius:16px;font-weight:700;cursor:pointer">💬 Guardar y Notificar</button>
<button onclick="closeM('mWA')" style="width:100%;margin-top:8px;padding:13px;background:#f1f5f9;color:#475569;border:none;border-radius:16px;font-weight:700;cursor:pointer">Cancelar</button>
</div></div>
<div class="overlay" id="mScanner" onclick="if(event.target===this)closeScanner()"><div class="modal" style="max-width:420px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h2 style="margin:0">📷 Escáner de paquetes</h2>
<button onclick="closeScanner()" style="background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:#64748b">✕</button>
</div>
<div style="font-size:.75rem;color:#64748b;margin-bottom:12px">Apunta al código. Al detectarlo se mueve a Exportar.</div>
<div class="scan-box"><video id="scanVideo" playsinline autoplay muted></video>
<div class="scan-frame"><div></div></div>
<div class="scan-status"><span id="scanStatus">Iniciando cámara...</span></div></div>
<div style="margin-top:14px"><div style="font-size:.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:6px">O código manual</div>
<div style="display:flex;gap:8px"><input type="text" id="scanManual" placeholder="Código..." style="flex:1;padding:12px;border-radius:13px;border:1.5px solid #e2e8f0;background:#f8fafc" onkeydown="if(event.key==='Enter')scanManualSubmit()"><button onclick="scanManualSubmit()" style="padding:12px 16px;background:#f59e0b;color:#fff;border:none;border-radius:13px;font-weight:700;cursor:pointer">✓</button></div></div>
<div id="scanLog" style="margin-top:14px;max-height:150px;overflow-y:auto"></div>
<button onclick="closeScanner()" style="width:100%;margin-top:14px;padding:13px;background:#f1f5f9;color:#475569;border:none;border-radius:16px;font-weight:700;cursor:pointer">Cerrar</button>
</div></div>
<div class="toast" id="tst"></div>
<script>
// ── CLAVES DE GUARDADO (las de tu otra app) ──
var SK=['','llega_ya_B_clientes','llega_ya_B_clientes2'];
var EK=['','llega_ya_B_exportados','llega_ya_B_exportados2'];
var cl=[null,JSON.parse(localStorage.getItem(SK[1])||'[]'),JSON.parse(localStorage.getItem(SK[2])||'[]')];
var ex=[null,JSON.parse(localStorage.getItem(EK[1])||'[]'),JSON.parse(localStorage.getItem(EK[2])||'[]')];
var tabs=[null,localStorage.getItem('lly_B_t1')||'pendientes',localStorage.getItem('lly_B_t2')||'pendientes'];
var route=+(localStorage.getItem('lly_B_route')||1);if(route!==1&&route!==2)route=1;
var tTimer,wUid=null,wSt=null,scanReader=null,scanLog=[];
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
for(var _r=1;_r<=2;_r++)cl[_r]=cl[_r].map(function(c){return c._uid?c:Object.assign({},c,{_uid:uid()});});
function cod(c){return c.pedidos?c.pedidos.reduce(function(s,p){return s+(parseFloat(p.cod)||0);},0):(parseFloat(c.cod)||0);}
function dedup(a){var s={};return a.filter(function(c){if(!c._uid)c._uid=uid();if(s[c._uid])return false;s[c._uid]=1;return true;});}
function save(){cl[1]=dedup(cl[1]);cl[2]=dedup(cl[2]);localStorage.setItem(SK[1],JSON.stringify(cl[1]));localStorage.setItem(SK[2],JSON.stringify(cl[2]));localStorage.setItem(EK[1],JSON.stringify(ex[1]));localStorage.setItem(EK[2],JSON.stringify(ex[2]));render();updCounts();}
function updCounts(){document.getElementById('cnt').textContent=cl[route].filter(function(c){return!c.estado||c.estado==='pendiente';}).length;}
function setRoute(r){route=r;localStorage.setItem('lly_B_route',String(r));document.getElementById('routeSelect').value=r;applyTheme();document.getElementById('bq').value='';updTabs();render();updCounts();}
function applyTheme(){var r2=route===2;document.getElementById('hdr').classList.toggle('header-r2',r2);document.getElementById('tb').classList.toggle('tb-r2',r2);document.getElementById('srch').classList.toggle('search-r2',r2);document.getElementById('tabs').classList.toggle('tabs-r2',r2);document.getElementById('hdrTitle').textContent=r2?'Ruta 2':'Ruta';document.getElementById('hdrSub').textContent=r2?'Anteriores':'Hoy';}
function switchTab(t){tabs[route]=t;localStorage.setItem(route===1?'lly_B_t1':'lly_B_t2',t);document.getElementById('bq').value='';updTabs();render();}
function updTabs(){var els=document.getElementById('tabs').querySelectorAll('.tab');['pendientes','sin_ubicacion','completados','exportar'].forEach(function(t,i){els[i].classList.toggle('active',t===tabs[route]);});}
function getData(r,t){var c=cl[r];if(t==='pendientes')return c.filter(function(x){return(x.estado==='pendiente'||!x.estado)&&x.lat&&x.lng;});if(t==='sin_ubicacion')return c.filter(function(x){return(!x.lat||!x.lng)&&(x.estado==='pendiente'||!x.estado);});if(t==='completados')return c.filter(function(x){return x.estado==='completado';});return[];}
function render(){updTabs();var t=tabs[route],le=document.getElementById('list'),mw=document.getElementById('mapWrap');
if(t==='exportar'){mw.style.display='none';renderExp();return;}
var q=(document.getElementById('bq').value||'').toLowerCase().trim();
var data=getData(route,t);
if(q)data=data.filter(function(c){var u4=c._uid?String(c._uid).slice(-4):'';return(c.nombre||'').toLowerCase().indexOf(q)>-1||(c.telefono||'').indexOf(q)>-1||(c._uid&&String(c._uid).toLowerCase().indexOf(q)>-1)||(u4&&u4===q)||(c.nota&&String(c.nota).toLowerCase().indexOf(q)>-1);});
if(t==='pendientes'){var gps=getData(route,'pendientes');if(gps.length){mw.style.display='block';if((mw.dataset.gc||'0')!==String(gps.length)){mw.dataset.gc=String(gps.length);drawMap(null,gps);}}else mw.style.display='none';}else mw.style.display='none';
if(!data.length){le.innerHTML='<div class="empty"><span>📦</span><p>No hay clientes aquí</p></div>';updCounts();return;}

{key:'devuelto',icon:'❌',label:'Devuelto',cls:'st-devuelto',msg:function(n,p,f,cd){return'[LLEGA YA] Hola '+n+'! Tu pedido '+p+' (Codigo: '+cd+') fue devuelto/cancelado.'+(f?' Fecha: '+f:'');}}];
function openWA(id){var c=cl[route].find(function(x){return x._uid===id;});if(!c)return;wUid=id;var nombre=(c.nombre||'').split(' ')[0],prod=c.nota||c.nombre||'tu pedido';
document.getElementById('waN').textContent=c.nombre||'Sin nombre';document.getElementById('waT').textContent='+'+(c.telefono||'');
document.getElementById('waE').innerHTML=waStates.map(function(s){return'<button class="wa-btn" id="wb-'+s.key+'" onclick="selWA(\''+s.key+'\')"><span style="font-size:1.1rem;width:24px;text-align:center">'+s.icon+'</span>'+s.label+'</button>';}).join('');
document.getElementById('waM').value='';document.getElementById('waCC').textContent='';
document.getElementById('waFecha').value=localStorage.getItem('lly_B_fecha')||'';
openM('mWA');var ls=localStorage.getItem('lly_B_last_wa_state')||'';if(ls)selWA(ls);}
function selWA(key){wSt=key;localStorage.setItem('lly_B_last_wa_state',key);document.querySelectorAll('.wa-btn').forEach(function(b){b.style.outline='';});var el=document.getElementById('wb-'+key);if(el)el.style.outline='2px solid #2563eb';actualizarMsg();}
function formatFecha(v){if(!v)return'';var p=v.split('-');if(p.length!==3)return v;var m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return p[2]+' de '+m[parseInt(p[1],10)-1]+' de '+p[0];}
function actualizarMsg(){if(!wSt)return;var c=cl[route].find(function(x){return x._uid===wUid;});if(!c)return;var s=waStates.find(function(x){return x.key===wSt;});if(!s)return;var n=(c.nombre||'').split(' ')[0],p=c.nota||c.nombre||'tu pedido',f=document.getElementById('waFecha').value;var msg=s.msg(n,p,f?formatFecha(f):'',c._uid);if(c.telefono)msg+='\nTel: +'+c.telefono;document.getElementById('waM').value=msg;var cc=document.getElementById('waCC');cc.textContent=msg.length+' chars';}
function sendWA(){if(!wSt){showToast('Selecciona un estado','error');return;}var c=cl[route].find(function(x){return x._uid===wUid;});if(!c||!c.telefono){showToast('Sin teléfono','error');return;}var tel=c.telefono.replace(/\D/g,''),msg=document.getElementById('waM').value;var a=document.createElement('a');a.href='https://wa.me/'+tel+'?text='+encodeURIComponent(msg);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();c.waEstado=wSt;save();closeM('mWA');showToast('WhatsApp abierto','success');}
function openScanner(){scanLog=[];document.getElementById('scanLog').innerHTML='';document.getElementById('scanManual').value='';document.getElementById('scanStatus').textContent='Iniciando cámara...';openM('mScanner');startZXing();}
function startZXing(){try{if(!window.ZXing){document.getElementById('scanStatus').textContent='Usa el campo manual';return;}var hints=new Map(),fmt=[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.PDF_417,ZXing.BarcodeFormat.ITF];hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,fmt);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);scanReader=new ZXing.BrowserMultiFormatReader(hints);scanReader.decodeFromVideoDevice(null,document.getElementById('scanVideo'),function(res){if(res)processScan(res.getText());}).catch(function(){document.getElementById('scanStatus').textContent='Usa el campo manual';});document.getElementById('scanStatus').textContent='Buscando código...';}catch(e){document.getElementById('scanStatus').textContent='Usa el campo manual';}}
function closeScanner(){if(scanReader){try{scanReader.reset();}catch(e){}scanReader=null;}var v=document.getElementById('scanVideo');if(v&&v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}closeM('mScanner');}
function scanManualSubmit(){var v=document.getElementById('scanManual').value.trim();if(v){processScan(v);document.getElementById('scanManual').value='';}}
function processScan(code){code=String(code).trim();if(!code)return;if(scanLog.indexOf(code)>-1)return;scanLog.push(code);var found=null,fr=null;[1,2].forEach(function(r){if(found)return;var c=cl[r].find(function(x){return x.lat&&x.lng&&(String(x._uid)===code||(x.nota&&x.nota.toLowerCase().indexOf(code.toLowerCase())>-1)||(x.nombre&&x.nombre.toLowerCase().indexOf(code.toLowerCase())>-1));});if(c){found=c;fr=r;}});var log=document.getElementById('scanLog');if(found){var pr=route;route=fr;addExp(found._uid);route=pr;save();document.getElementById('scanStatus').textContent='OK: '+found.nombre;log.innerHTML='<div style="padding:6px 10px;background:#dcfce7;border-radius:10px;margin-bottom:6px;font-size:.78rem;font-weight:700;color:#166534">✓ '+found.nombre+' → Exportar</div>'+log.innerHTML;showToast(found.nombre+' movido a Exportar','success');}else{document.getElementById('scanStatus').textContent='No encontrado: '+code;log.innerHTML='<div style="padding:6px 10px;background:#fee2e2;border-radius:10px;margin-bottom:6px;font-size:.78rem;font-weight:700;color:#991b1b">✕ No encontrado: '+code+'</div>'+log.innerHTML;showToast('Código no encontrado','error');}setTimeout(function(){document.getElementById('scanStatus').textContent='Buscando código...';},2000);}
function openM(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';if(id==='mCfg')document.getElementById('cfgTitle').textContent='⚙️ Opciones — Ruta '+route;}
function closeM(id){document.getElementById(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.style.overflow='';}
document.addEventListener('click',function(e){if(e.target.classList.contains('overlay'))e.target.classList.remove('open');});
function showToast(m,t){var el=document.getElementById('tst');el.innerHTML=m;el.className='toast '+(t||'info')+' show';clearTimeout(tTimer);tTimer=setTimeout(function(){el.classList.remove('show');},2800);}
document.getElementById('routeSelect').value=route;applyTheme();updTabs();render();updCounts();
</script>
